<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fare Estimator — Le Rica, General Trias, Cavite</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; background: #f5f7fa; }
    .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { color: #2c3e50; text-align: center; }
    .note { color: #556; font-size: 0.95rem; text-align: center; margin-bottom: 1.5rem; }
    label { display: block; margin: 1rem 0 0.3rem; font-weight: bold; }
    input, button { width: 100%; padding: 0.85rem; border-radius: 6px; border: 1px solid #ddd; font-size: 1rem; }
    button { background: #2563eb; color: white; border: none; margin-top: 1.2rem; cursor: pointer; font-weight: bold; }
    button:hover { background: #1d4ed8; }
    .result { margin-top: 1.5rem; padding: 1.2rem; border-radius: 8px; display: none; }
    .success { background: #ecfdf3; border-left: 4px solid #22c55e; color: #15803d; }
    .error { background: #fef2f2; border-left: 4px solid #ef4444; color: #b91c1c; }
    .fare { font-size: 1.4rem; font-weight: bold; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚕 Fare Estimator</h1>
    <p class="note">Home Base: <strong>Le Rica, General Trias, Cavite</strong><br>Service: All Luzon destinations only</p>

    <label for="destination">Enter Destination:</label>
    <input type="text" id="destination" placeholder="e.g. Makati, Baguio, Batangas, etc.">

    <button onclick="calculateFare()">Estimate Fare</button>

    <div id="resultBox" class="result">
      <div id="resultText"></div>
    </div>
  </div>

  <script>
    // ==============================================
    // CONFIGURATION — EDIT THESE VALUES AS NEEDED
    // ==============================================
    const HOME_BASE = {
      name: "Le Rica, General Trias, Cavite",
      region: "Luzon"
    };

    // Complete list of areas covered
    const LUZON_AREAS = [
      // Cavite — Home Base
      "Cavite", "General Trias", "Le Rica", "Le Rica, General Trias",
      "Bacoor", "Dasmariñas", "Imus", "Kawit", "Noveleta", "Rosario",
      "Silang", "Tagaytay", "Trece Martires", "Amadeo", "Alfonso",
      "Magallanes", "Maragondon", "Mendez", "Naic", "Tanza",

      // Metro Manila
      "Metro Manila", "Manila", "Makati", "Taguig", "Quezon City", "Pasay",
      "Mandaluyong", "Pasig", "Muntinlupa", "Las Piñas", "Parañaque",
      "Valenzuela", "Caloocan", "Malabon", "Navotas", "San Juan", "Marikina",

      // Calabarzon
      "Laguna", "Santa Rosa", "Calamba", "San Pablo", "Biñan", "San Pedro",
      "Batangas", "Batangas City", "Lipa", "Tanauan", "Taal", "Nasugbu",
      "Rizal", "Antipolo", "Cainta", "Taytay", "Angono",
      "Quezon", "Lucena", "Tayabas",

      // Central Luzon
      "Bulacan", "Malolos", "San Jose del Monte", "Baliwag",
      "Pampanga", "San Fernando", "Angeles", "Clark",
      "Bataan", "Balanga", "Mariveles",
      "Zambales", "Olongapo", "Subic",
      "Tarlac", "Tarlac City",
      "Nueva Ecija", "Cabanatuan", "Gapan",

      // Northern Luzon
      "Benguet", "Baguio", "La Trinidad",
      "Pangasinan", "Dagupan", "San Carlos",
      "La Union", "San Fernando, La Union",
      "Ilocos Norte", "Laoag",
      "Ilocos Sur", "Vigan",

      // Cagayan Valley
      "Cagayan", "Tuguegarao",
      "Isabela", "Santiago", "Ilagan",
      "Nueva Vizcaya", "Bayombong",

      // Bicol Region
      "Camarines Norte", "Daet",
      "Camarines Sur", "Naga", "Legazpi",
      "Albay", "Daraga",
      "Sorsogon", "Sorsogon City"
    ];

    const RATES = {
      baseFarePHP: 180,
      ratePerKmPHP: 9.5
    };

    // ==============================================
    // CORE LOGIC — DO NOT MODIFY UNLESS NEEDED
    // ==============================================
    function normalizeText(str) {
      return str.trim().toLowerCase().replace(/\s+/g, " ");
    }

    function isDestinationIncluded(destination) {
      if (!destination || destination.trim() === "") return false;
      const dest = normalizeText(destination);

      // Always include home base
      if (dest.includes(normalizeText(HOME_BASE.name))) return true;

      // Check against all Luzon areas
      for (const area of LUZON_AREAS) {
        if (dest.includes(normalizeText(area))) return true;
      }
      return false;
    }

    // Simple distance estimation — replace with actual if you have it
    function estimateDistanceKm(toDest) {
      const d = normalizeText(toDest);
      if (d.includes("makati") || d.includes("manila")) return 30;
      if (d.includes("baguio")) return 260;
      if (d.includes("batangas")) return 65;
      if (d.includes("laguna") || d.includes("santa rosa") || d.includes("calamba")) return 35;
      if (d.includes("pampanga") || d.includes("angeles")) return 110;
      if (d.includes("bulacan")) return 55;
      if (d.includes("tagaytay")) return 25;
      if (d.includes("bicol") || d.includes("naga") || d.includes("legazpi")) return 380;
      if (d.includes("cavite")) return 15;
      return 40; // Default estimate
    }

    function calculateFare() {
      const destination = document.getElementById("destination").value;
      const resultBox = document.getElementById("resultBox");
      const resultText = document.getElementById("resultText");

      resultBox.style.display = "none";
      resultBox.className = "result";

      if (!isDestinationIncluded(destination)) {
        resultBox.style.display = "block";
        resultBox.className = "result error";
        resultText.innerHTML = `
          <strong>❌ Destination Not Covered</strong><br>
          "${destination}" is outside our Luzon service area.<br>
          Service is available from ${HOME_BASE.name} to all Luzon destinations only.
        `;
        return;
      }

      const distanceKm = estimateDistanceKm(destination);
      const fare = RATES.baseFarePHP + (distanceKm * RATES.ratePerKmPHP);

      resultBox.style.display = "block";
      resultBox.className = "result success";
      resultText.innerHTML = `
        <strong>✅ Available</strong><br>
        From: ${HOME_BASE.name}<br>
        To: ${destination}<br>
        Est. Distance: ~${distanceKm} km
        <div class="fare">Est. Fare: ₱${fare.toFixed(2)}</div>
      `;
    }
  </script>
</body>
</html>
