<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1c26"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4b8"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a7b1c"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Inner Crest / Shield -->
  <g transform="translate(0, 0)">
    <!-- Wings / Speed Flairs -->
    <path d="M120 280 C150 250, 200 245, 256 245 C312 245, 362 250, 392 280 C360 295, 310 295, 256 295 C202 295, 152 295, 120 280 Z" fill="url(#goldGrad)" opacity="0.3"/>
    
    <!-- Stylized Luxury Car / Chauffeur silhouette -->
    <path d="M170 240 L210 180 Q256 172 302 180 L342 240 Q380 250 390 270 L400 310 Q400 325 385 325 L127 325 Q112 325 112 310 L122 270 Q132 250 170 240 Z" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
    
    <!-- Car Windshield & Window Cutouts -->
    <path d="M216 195 L250 195 L250 235 L186 235 Z" fill="#0a0a0f"/>
    <path d="M262 195 L296 195 L326 235 L262 235 Z" fill="#0a0a0f"/>

    <!-- Headlights glow -->
    <ellipse cx="140" cy="285" rx="14" ry="8" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="372" cy="285" rx="14" ry="8" fill="#ffffff" opacity="0.9"/>

    <!-- Wheels / Chrome hubs -->
    <circle cx="160" cy="325" r="22" fill="#0a0a0f" stroke="url(#goldGrad)" stroke-width="6"/>
    <circle cx="352" cy="325" r="22" fill="#0a0a0f" stroke="url(#goldGrad)" stroke-width="6"/>

    <!-- GoCav Monogram Text -->
    <text x="256" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="4" fill="url(#goldGrad)">GOCAV</text>
    <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" letter-spacing="6" fill="#fdf4b8" opacity="0.8">TRANSPORT</text>
    <text x="256" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="12" letter-spacing="3" fill="#8e90a5">PREMIUM CHAUFFEUR</text>
  </g>
</svg>
